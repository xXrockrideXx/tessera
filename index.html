<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Tessera</title>
<meta name="description" content="Touch-friendly vector shape studio">
<meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#192027" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tessera">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif;overscroll-behavior:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Tessera Shape Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=DM+Serif+Display&display=swap">
<style>
/* Layout: full-screen app — toolbar / zoomable stage / tool panel / tab bar; panel docks right on wide screens */
:root{
  --bg:#e7ebef; --panel:#f8f9fb; --sunk:#eef1f4; --ink:#1b232d; --muted:#667180; --line:#d3d9e0;
  --accent:#0d7a70; --accent-ink:#ffffff; --accent-soft:#d6ece9; --danger:#b23a2e;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161b; --panel:#192027; --sunk:#141a20; --ink:#e4e9ee; --muted:#8b96a3; --line:#2a333d;
  --accent:#3dbcac; --accent-ink:#06211e; --accent-soft:#183a37; --danger:#e0705f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161b; --panel:#192027; --sunk:#141a20; --ink:#e4e9ee; --muted:#8b96a3; --line:#2a333d;
  --accent:#3dbcac; --accent-ink:#06211e; --accent-soft:#183a37; --danger:#e0705f; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "stage" "panel" "tabs"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:4px;padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0 8px 0 4px;display:flex;align-items:center;gap:7px}
.brand{border-radius:10px;padding:6px 8px;margin:0 2px}
.brand:hover{background:var(--sunk)}
.brand span{max-width:22vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand i{width:16px;height:16px;display:inline-block;background:conic-gradient(var(--accent) 0 25%,#c8553d 0 50%,#e9a03b 0 75%,#2f5bd3 0);border-radius:3px;transform:rotate(45deg) scale(.8)}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink);position:relative}
.ib svg{width:22px;height:22px}
.ib:hover{background:var(--sunk)}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ib:disabled{opacity:.3;cursor:default;background:none}
.sp{flex:1}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
@media (max-width:420px){.brand span{display:none}.ib{width:36px}.top{gap:1px}.sep{margin:0 2px}}

/* stage */
.stage{grid-area:stage;position:relative;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zoom{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;font-family:var(--f-mono);font-size:12px;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.eptag{position:absolute;top:12px;left:50%;transform:translateX(-50%);box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:5}
.qbar{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:4;max-height:calc(100% - 24px);pointer-events:none}
.qitems{display:flex;flex-direction:column;align-items:center;gap:6px;overflow:auto;scrollbar-width:none;padding:4px;margin:-4px;pointer-events:auto}
.qitems::-webkit-scrollbar{display:none}
.qitems>button,.qpair button,.qtoggle{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel);color:var(--accent);border:1px solid var(--line);box-shadow:0 3px 10px rgba(10,20,30,.13);flex:0 0 auto;transition:transform .12s}
.qitems>button:active,.qpair button:active,.qtoggle:active{transform:scale(.9)}
.qitems svg,.qtoggle svg{width:21px;height:21px}
.qpair{display:flex;flex-direction:column;border-radius:21px;background:var(--panel);border:1px solid var(--line);box-shadow:0 3px 10px rgba(10,20,30,.13);overflow:hidden}
.qpair button{border:0;box-shadow:none;border-radius:0;height:38px}
.qpair button+button{border-top:1px solid var(--line)}
.qtoggle{pointer-events:auto;background:var(--ink);color:var(--panel);border-color:var(--ink);width:48px;height:48px}
.qbar.closed .qitems{display:none}
.qbar.closed .qtoggle{background:var(--panel);color:var(--ink);border-color:var(--line)}
@media (prefers-reduced-motion:no-preference){.qitems>*{animation:qin .18s ease-out backwards}.qitems>*:nth-last-child(2){animation-delay:.03s}.qitems>*:nth-last-child(3){animation-delay:.06s}.qitems>*:nth-last-child(4){animation-delay:.09s}.qitems>*:nth-last-child(5){animation-delay:.12s}.qitems>*:nth-last-child(6){animation-delay:.15s}}
@keyframes qin{from{opacity:0;transform:translateY(10px) scale(.85)}}
.lybar{--lyw:212px;position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:8px;max-height:calc(100% - 64px);max-width:calc(100% - 90px);pointer-events:none}
.lytoggle{pointer-events:auto;display:flex;align-items:center;gap:8px;min-height:48px;padding:3px 14px 3px 4px;text-align:left;border-radius:24px;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 3px 10px rgba(10,20,30,.13);transition:transform .12s;max-width:100%}
.lytoggle:active{transform:scale(.95)}
.lytoggle .lyic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:0 0 auto}
.lytoggle .lyic svg{width:22px;height:22px}
.lybar:not(.closed) .lytoggle .lyic{background:var(--ink);color:var(--panel)}
.lytoggle .lyname{font-size:14px;font-weight:600;max-width:calc(var(--lyw) - 66px);line-height:1.15;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.lylist{pointer-events:auto;display:grid;grid-template-columns:var(--lyw,212px);justify-items:stretch;align-content:start;gap:5px;overflow:auto;scrollbar-width:none;padding:4px;margin:-4px}
.lylist::-webkit-scrollbar{display:none}
.lybar.closed .lylist{display:none}
.lyrow{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 3px 10px rgba(10,20,30,.13);min-height:40px;padding:2px;flex:0 0 auto}
.lyrow.act{border-color:var(--accent);background:var(--accent-soft)}
.lyrow .lpick{flex:1;min-width:0;text-align:left;padding:2px 4px 2px 12px;min-height:36px;font-size:14px;display:flex;align-items:center;gap:5px;background:none;border:0;color:var(--ink);font-family:inherit}
.lyrow .lpick .t{min-width:0;line-height:1.15;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.lyrow .lpick small{font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:0 0 auto}
.lyrow.act .lpick{font-weight:600}
.lyrow.dim .lpick{opacity:.45}
.lyrow>button:not(.lpick){width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:none;border:0;flex:0 0 auto}
.lyrow>button:not(.lpick):active{background:var(--sunk)}
.lyrow svg{width:18px;height:18px}
.lyrow button[aria-pressed="true"]{color:var(--ink)}
.lyrow.tools{justify-content:flex-start;gap:2px;padding:0 3px}
.lyrow.tools button:disabled{opacity:.3}
@media (prefers-reduced-motion:no-preference){.lylist>*{animation:lyin .16s ease-out backwards}}
@keyframes lyin{from{opacity:0;transform:translateY(-8px) scale(.94)}}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:52px;font-size:12px;color:var(--muted);max-width:60%}
.artshadow{filter:drop-shadow(0 2px 10px rgba(20,30,40,.14))}

/* panel */
.pwrap{grid-area:panel;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-top:1px solid var(--line)}
.handle{display:flex;align-items:center;justify-content:center;gap:8px;position:relative;padding:7px 16px 5px;color:var(--muted);font-family:var(--f-display);font-size:13px;letter-spacing:.04em;touch-action:none}
.handle .grip{position:absolute;top:4px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
.handle .hlab{margin-top:6px}
.handle .chev{width:16px;height:16px;margin-top:6px;transition:transform .2s}
#app.collapsed .handle .chev{transform:rotate(180deg)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 52px;height:52px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.strip button:active{transform:scale(.92)}
.strip svg{width:70%;height:70%}
.strip .txt{font-family:"DM Serif Display",Georgia,serif;font-size:24px;color:var(--ink)}
.panel{background:var(--panel);height:min(272px,36vh);overflow:auto;padding-block:6px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:899px){
  #app.collapsed .panel{height:auto;padding-block:2px 10px}
  #app.collapsed:not(.t-shapes) .panel{display:none}
}
.tabs{grid-area:tabs;display:grid;grid-template-columns:repeat(5,1fr);background:var(--sunk);border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{padding:12px 4px 13px;font-family:var(--f-display);font-weight:500;font-size:15px;color:var(--muted);position:relative}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--panel)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
@media (min-width:900px){
  #app{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top top" "stage tabs" "stage panel"}
  .pwrap{border-top:0;border-left:1px solid var(--line)}
  .handle{display:none}
  .panel{height:auto;flex:1;padding-block:14px}
  .tabs{border-top:0;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
}

h3{font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sec{display:grid;gap:8px;margin-bottom:16px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px}
.lib button{aspect-ratio:1;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--muted);transition:transform .12s}
.lib button:hover{color:var(--ink)}
.lib button:active{transform:scale(.92)}
.lib svg{width:70%;height:70%}
.lib .txt{font-family:"DM Serif Display",Georgia,serif;font-size:24px;color:var(--ink)}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;justify-self:start}
.seg button{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:7px}
.sw button,.sw label{aspect-ratio:1;border-radius:50%;border:1px solid rgba(0,0,0,.12);position:relative;cursor:pointer}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.sw .none{background:linear-gradient(135deg,transparent 46%,var(--danger) 46% 54%,transparent 54%),var(--panel)}
.sw label{background:conic-gradient(#e94b3c,#f5c341,#5fb35f,#3aa6c9,#5a5fd6,#c74fc0,#e94b3c);display:block}
.sw label input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row label{font-size:13px;color:var(--muted);min-width:64px}
input[type=range]{flex:1;accent-color:var(--accent);min-width:120px}
.val{font-family:var(--f-mono);font-size:12px;width:44px;text-align:right;font-variant-numeric:tabular-nums}
.tin{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);-webkit-user-select:text;user-select:text}
select.tin{padding:8px 10px}
.num{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.num label{display:grid;gap:3px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.num input{width:100%;min-width:0;font-family:var(--f-mono);font-size:14px;padding:8px 6px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;background:var(--sunk);font-size:13px}
.btns button svg{width:18px;height:18px}
.btns button:disabled{opacity:.35;cursor:default}
.btns .pbtn{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btns button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pre{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--sunk);text-align:left}
.pre[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.pre .pvw{width:30px;height:30px;display:grid;place-items:center;flex:0 0 auto}.pre .pv{background:var(--panel);border:1.5px solid var(--muted);border-radius:3px}
.pre b{display:block;font-weight:600;font-size:13px}.pre small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ptypes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ptype{display:grid;justify-items:center;gap:4px;padding:10px 4px 8px;border-radius:12px;background:var(--sunk);font-size:12px;color:var(--muted)}
.ptype svg{width:30px;height:30px;color:var(--ink)}
.ptype[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.ptype[aria-pressed="true"] svg{color:var(--accent)}
.ptype:disabled{opacity:.4;cursor:default}
.plist{display:grid;gap:4px}
.plist button{text-align:left;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:14px}
.plist button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.mylib{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.stile{position:relative;display:grid;gap:4px;min-width:0}
.sthumb{aspect-ratio:1;border-radius:10px;background:var(--sunk);display:grid;place-items:center;padding:8px;transition:transform .12s}
.sthumb:active{transform:scale(.94)}
.sthumb svg,.strip .sv svg,.sprev svg{width:100%;height:100%}
.sname{font-size:11px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smore{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--muted);background:var(--panel);opacity:.9}
.smore svg{width:16px;height:16px}
.strip .sv{padding:6px}
.sprev{height:120px;display:grid;place-items:center;background:var(--sunk);border-radius:12px;padding:12px}
.layers{display:grid;gap:4px}
.bgrow{display:flex;gap:12px;align-items:center}
.bgthumb{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:0 0 auto}
.gr{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;align-items:center;gap:8px;padding:2px 4px}
.gr .ga{font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.gr .ib{width:34px;height:34px}.gr .ib svg{width:18px;height:18px}
.tabs button{font-size:14px}
.lr{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer}
.lr:hover{background:var(--sunk)}
.lr.on{background:var(--accent-soft)}
.lr .th{width:34px;height:34px;border-radius:7px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.lr .th svg{width:26px;height:26px}
.lr .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .nm small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.lr .ib{width:34px;height:34px}
.lr .ib svg{width:18px;height:18px}
.lr.dim .nm,.lr.dim .th{opacity:.4}
.lyhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.lyhead h3{margin:0}
.lyhead .pbtn{display:flex;align-items:center;gap:6px;padding:7px 12px}.lyhead .pbtn svg{width:16px;height:16px}
.ly{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;align-items:center;gap:6px;padding:4px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.ly.act{border-color:var(--accent);background:var(--accent-soft)}
.ly .lnm{text-align:left;min-width:0;padding:4px 2px;background:none;border:0;font:inherit;color:inherit;cursor:pointer}
.ly .lnm b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ly .lnm small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.ly .ib{width:34px;height:34px}.ly .ib svg{width:18px;height:18px}.ly .fold:disabled{opacity:.25}
.ly.dim .lnm{opacity:.45}
.lyitems{display:grid;gap:2px;margin:2px 0 6px 18px;padding-left:8px;border-left:2px solid var(--line)}

/* menu + modal + toast */
.menu{position:absolute;top:56px;left:max(10px,env(safe-area-inset-left,0px));z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:220px;box-shadow:0 12px 32px rgba(10,20,30,.18);display:grid}
.menu button{text-align:left;padding:11px 12px;border-radius:8px;font-size:15px;display:flex;gap:10px;align-items:center}
.menu button:hover{background:var(--sunk)}
.menu button svg{width:18px;height:18px;color:var(--muted)}
.menu .mver{padding:8px 12px 4px;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.menu .mname{padding:8px 12px 6px;font-family:var(--f-display);font-weight:700;font-size:15px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,15,20,.5);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border-radius:16px;padding:18px;width:min(520px,100%);max-height:90%;overflow:auto;display:grid;gap:12px}
.mbox h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0}
.mbox img{width:100%;border-radius:10px;border:1px solid var(--line);background:repeating-conic-gradient(#e6e6e6 0 25%,#fff 0 50%) 0/16px 16px;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.mbox textarea{width:100%;height:110px;font-family:var(--f-mono);font-size:11px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);padding:8px;resize:vertical;-webkit-user-select:text;user-select:text}
.pbtn{background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:10px;font-weight:600}
.library{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.lhead{display:flex;align-items:center;gap:6px;background:var(--panel);border-bottom:1px solid var(--line);padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.lhead h2{flex:1;min-width:0;margin:0 6px;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbtn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:var(--sunk);font-size:14px;font-weight:500}
.lbtn svg{width:18px;height:18px}
.lbody{overflow:auto;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start}
.lsec h3{margin-bottom:10px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.dcard,.fcard,.dnew{position:relative;border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left;min-width:0}
.dcard .dth{aspect-ratio:1;display:grid;place-items:center;padding:12px;background:repeating-conic-gradient(var(--sunk) 0 25%,transparent 0 50%) 0/14px 14px;border-radius:13px 13px 0 0;border-bottom:1px solid var(--line)}
.dcard .dth img{max-width:100%;max-height:100%;width:auto;height:auto;box-shadow:0 1px 6px rgba(10,20,30,.16);background:#fff}
.dmeta{padding:9px 40px 10px 11px;display:grid;gap:2px;min-width:0}
.dmeta b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmeta small{font-size:12px;color:var(--muted)}
.dcard.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dcard.cur small{color:var(--accent)}
.dmore{position:absolute;right:4px;bottom:4px;width:34px!important;height:34px!important}
.fcard{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px;padding:12px 40px 12px 12px}
.fcard>svg{width:30px;height:30px;color:var(--accent)}
.fcard b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard small{font-size:12px;color:var(--muted)}
.fcard .dmore{top:50%;bottom:auto;transform:translateY(-50%)}
.dnew{display:grid;place-items:center;align-content:center;gap:8px;min-height:190px;border-style:dashed;color:var(--accent);font-weight:600;font-size:14px;background:transparent}
.dnew svg{width:30px;height:30px}
.lempty{color:var(--muted);font-size:14px;margin:0}
.lfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:var(--panel);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lfoot button{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:10px;background:var(--sunk);font-size:13px}
.lfoot svg{width:18px;height:18px}
.sheet .btns button{font-size:14px;padding:10px 12px}
.sheet .list{display:grid;gap:4px}
.sheet .list button{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;background:var(--sunk);text-align:left;font-size:15px}
.sheet .list button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.sheet .list svg{width:20px;height:20px}
.danger{color:var(--danger)!important}
.btns .pbtn.dng{background:var(--danger);color:#fff}
.toast{position:fixed;left:50%;top:124px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:999px;font-size:13px;z-index:50;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header class="top">
    <button class="ib" id="bMenu" aria-label="Menu" title="Menu"></button>
    <button class="brand" id="bLib" title="My designs" aria-label="My designs"><i></i><span id="dname">Tessera</span></button>
    <div class="sep"></div>
    <button class="ib" id="bSnap" aria-label="Smart snapping" title="Smart snapping (guides, 15° rotation)"></button>
    <button class="ib" id="bMulti" aria-label="Multi-select" title="Multi-select: tap to add shapes"></button>
    <button class="ib" id="bPen" aria-label="Pen: draw lines and curves" title="Pen: draw lines and curves (P)"></button>
    <div class="sp"></div>
    <button class="ib" id="bDup" aria-label="Duplicate" title="Duplicate (Ctrl+D)"></button>
    <button class="ib" id="bDel" aria-label="Delete" title="Delete"></button>
    <div class="sep"></div>
    <button class="ib" id="bUndo" aria-label="Undo" title="Undo (Ctrl+Z)"></button>
    <button class="ib" id="bRedo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)"></button>
  </header>
  <div class="stage" id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#7d93a8" stroke-opacity=".22" stroke-width="1"/></pattern>
        <pattern id="gridM" width="250" height="250" patternUnits="userSpaceOnUse"><path d="M250 0H0V250" fill="none" stroke="#7d93a8" stroke-opacity=".42" stroke-width="1"/></pattern>
      </defs>
      <g id="world"></g>
    </svg>
    <div class="hint" id="hint">With a shape selected, drag anywhere to move it · tap empty space to deselect · two fingers to pan and zoom</div>
    <div class="lybar closed" id="lybar">
      <button class="lytoggle" id="lyToggle" aria-expanded="false" aria-controls="lylist" title="Layers (L)"><span class="lyic"></span><span class="lyname" id="lyActName">Layer 1</span></button>
      <div class="lylist" id="lylist" role="group" aria-label="Layers"></div>
    </div>
    <div class="qbar" id="qbar" hidden>
      <div class="qitems" id="qitems">
        <div class="qpair"><button data-qa="order" data-arg="fwd" title="Bring forward" aria-label="Bring forward"></button><button data-qa="order" data-arg="bwd" title="Send backward" aria-label="Send backward"></button></div>
        <button data-qa="flip" data-arg="h" title="Mirror left to right (Shift+H)" aria-label="Mirror left to right"></button>
        <button data-qa="flip" data-arg="v" title="Flip top to bottom (Shift+V)" aria-label="Flip top to bottom"></button>
        <button data-qa="dup" title="Duplicate" aria-label="Duplicate"></button>
        <button data-qa="tpattach" id="qTp" title="Text on path" aria-label="Put text on path"></button>
        <button data-qa="savesel" title="Save shape to My shapes" aria-label="Save shape to My shapes"></button>
        <button data-qa="rpopen" title="Repeat around" aria-label="Repeat around"></button>
        <button data-qa="rot90" title="Rotate 90° clockwise" aria-label="Rotate 90 degrees clockwise"></button>
        <button data-qa="group" id="qGroup" title="Group (Ctrl+G)" aria-label="Group"></button>
        <button data-qa="ungroup" id="qUngroup" title="Ungroup (Ctrl+Shift+G)" aria-label="Ungroup"></button>
        <button data-qa="sbstart" id="qBuild" title="Shape builder (Shift+M)" aria-label="Shape builder"></button>
      </div>
      <button class="qtoggle" id="qtoggle" aria-expanded="true" aria-controls="qitems" aria-label="Hide quick tools" title="Quick tools"></button>
    </div>
    <button class="zoom" id="zoom" title="Fit to screen">100%</button>
    <button class="eptag pbtn" id="epDone" hidden>Done editing points</button>
    <input type="file" id="bgfile" accept="image/*" hidden>
  </div>
  <div class="pwrap" id="pwrap">
    <button class="handle" id="handle" aria-label="Collapse panel" aria-expanded="true"><span class="grip"></span><span class="hlab" id="hlab">Shapes</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <section class="panel" id="panel"></section>
  </div>
  <div class="library" id="lib" hidden role="dialog" aria-label="My designs">
    <header class="lhead">
      <button class="ib" id="libBack" aria-label="Back to all designs" hidden></button>
      <h2 id="libTitle">My designs</h2>
      <button class="lbtn" id="libNewFolder"></button>
      <button class="ib" id="libClose" aria-label="Back to the canvas" title="Back to the canvas"></button>
    </header>
    <div class="lbody" id="libBody"></div>
    <footer class="lfoot">
      <button id="libBackup"></button><button id="libRestore"></button>
      <input type="file" id="libFile" accept=".json,application/json" hidden>
    </footer>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="shapes">Shapes</button>
    <button role="tab" data-tab="style">Style</button>
    <button role="tab" data-tab="arrange">Arrange</button>
    <button role="tab" data-tab="layers">Layers</button>
    <button role="tab" data-tab="grid">Grid</button>
  </nav>
</div>

let spaceDown=false;

  if(e.target.matches('input,textarea,select'))return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(k===' '){spaceDown=true;e.preventDefault();return}
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();return}
  if(mod&&k==='y'){e.preventDefault();doRedo();return}
  if(mod&&k==='d'){e.preventDefault();act('dup');return}
  if(mod&&k==='a'){e.preventDefault();act('selall');return}
  if(k==='alt'&&sb){sb.mode=sb.mode==='merge'?'erase':'merge';renderPanel();return}
  if(k==='delete'||k==='backspace'){if(sb)return;e.preventDefault();act(ep?(ep.sel.length?'eprem':''):'del');return}
  if(!$('lib').hidden){if(k==='escape'){sheetEl?closeSheet():closeLib()}return}
  if(pen){
    if(k==='escape'||k==='enter'){e.preventDefault();pen.pts.length>=2?finishPen(false):cancelPen();return}
    if(k==='backspace'||k==='delete'){e.preventDefault();if(pen.pts.length){pen.pts.pop();renderAfterSel()}return}
  }
  if(k==='p'&&!mod&&!pen&&!e.shiftKey){e.preventDefault();startPen();return}
  if(k==='l'&&!mod&&!e.shiftKey){e.preventDefault();setLyOpen(!lyOpen);return}
  if(k==='escape'){if(sb)return sbFinish(false);if(ep)return exitEdit();sel=[];inG=null;refresh();return}
  if(e.shiftKey&&!mod&&k==='m'){e.preventDefault();sb?sbFinish(true):act('sbstart');return}
  if(e.shiftKey&&!mod&&(k==='h'||k==='v')){e.preventDefault();act('flip',k);return}
  if(mod&&k==='g'){e.preventDefault();act(e.shiftKey?'ungroup':'group');return}
  if(k==='0'&&mod){e.preventDefault();fit();return}
  const ar={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1]}[k];
  if(ar&&ep&&ep.sel.length){e.preventDefault();pushUndo();const s=byId(ep.id),st=e.shiftKey?10:1;
    epSelNodes().forEach(({n})=>{const a=worldOf(s,n.x,n.y),u=unitOf(s,{x:a.x+ar[0]*st,y:a.y+ar[1]*st}),dx=u.u-n.x,dy=u.v-n.y;for(const k of['x','ix','ox'])n[k]+=dx;for(const k of['y','iy','oy'])n[k]+=dy});
    normalisePts(s,ep.cs);refresh();return}
  if(ar&&sel.length){e.preventDefault();pushUndo();const st=e.shiftKey?10:1;selShapes().forEach(s=>{s.x+=ar[0]*st;s.y+=ar[1]*st});refresh()}

const MEM={designs:{},images:{},meta:{}};
const DB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('tessera',1);
    r.onupgradeneeded=()=>{const d=r.result;['designs','images','meta'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};
    r.onsuccess=()=>{DB.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
  req(store,mode,fn){if(!DB.db)return Promise.resolve(fn(null,MEM[store]));
    return new Promise(res=>{try{const t=DB.db.transaction(store,mode),r=fn(t.objectStore(store));t.oncomplete=()=>res(r?r.result:undefined);t.onerror=t.onabort=()=>res(undefined)}catch(e){res(undefined)}})},
  get(s,k){return DB.req(s,'readonly',(st,m)=>st?st.get(k):m[k])},
  put(s,k,v){return DB.req(s,'readwrite',(st,m)=>st?st.put(v,k):(m[k]=v,undefined))},
  del(s,k){return DB.req(s,'readwrite',(st,m)=>st?st.delete(k):(delete m[k],undefined))},
  all(s){return DB.req(s,'readonly',(st,m)=>st?st.getAll():Object.values(m)).then(v=>v||[])},
};

async function backup(){
  await flushSave();const designs=await DB.all('designs'),images={};
  for(const d of designs){const id=d.doc&&d.doc.bgImg&&d.doc.bgImg.id;if(id&&!images[id]){const im=bgData[id]||await DB.get('images',id);if(im)images[id]=im}}
  const data=JSON.stringify({app:'tessera',version:1,exported:new Date().toISOString(),folders,designs,images,saved});
  const name=`tessera-backup-${new Date().toISOString().slice(0,10)}.json`,blob=new Blob([data],{type:'application/json'});
  const r=await offerFile(name,blob);if(r==='saved')return toast(`Backed up ${designs.length} design${designs.length===1?'':'s'}`);if(r)return;
  try{const f=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Tessera backup'});return}
  }catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  toast(`Saving ${designs.length} design${designs.length===1?'':'s'} to ${name}`);
}

    if(!b||b.app!=='tessera'||!Array.isArray(b.designs))return toast('That file isn’t a Tessera backup');
    for(const f of b.folders||[])if(!folders.some(x=>x.id===f.id))folders.push(f);await saveFolders();

    for(const[id,data]of Object.entries(b.images||{}))await DB.put('images',id,data);
    let n=0;const have=await DB.all('designs');
    for(const d of b.designs){const ex=have.find(x=>x.id===d.id);if(ex&&ex.updated>=d.updated)continue;await DB.put('designs',d.id,d);n++}

$('bLib').onclick=openLib;$('libClose').onclick=closeLib;$('libBack').onclick=()=>{libFolder=null;renderLib()};
$('libNewFolder').onclick=()=>folderSheet(null);$('libBackup').onclick=backup;$('libRestore').onclick=()=>$('libFile').click();
$('libBody').addEventListener('click',e=>{
  const m=e.target.closest('[data-more]');if(m)return designSheet(m.dataset.more);
  const fm=e.target.closest('[data-fmore]');if(fm)return folderSheet(fm.dataset.fmore);
  if(e.target.closest('[data-new]'))return newDesign(libFolder);
  const f=e.target.closest('[data-folder]');if(f){libFolder=f.dataset.folder;return renderLib()}
  const o=e.target.closest('[data-open]');if(o)openDesign(o.dataset.open);
});
$('libBody').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[role=button]'))e.target.click()});
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave()});
addEventListener('pagehide',flushSave);
async function initLibrary(){
  dbOK=await DB.open();folders=(await DB.get('meta','folders'))||[];await loadSaved();
  let rec=curId&&await DB.get('designs',curId);
  if(!rec){const list=await DB.all('designs');curId=curId||uid();curName=nextName(list);curFolder=null;lastSaved='';
    try{localStorage.setItem('tessera.current',curId)}catch(e){}await flushSave()}
  else{curName=rec.name;curFolder=rec.folder||null;lastSaved=''}
  const b=doc.bgImg;if(b){if(bgData[b.id])DB.put('images',b.id,bgData[b.id]);else{const d=await DB.get('images',b.id);if(d){bgData[b.id]=d;renderCanvas()}}}
  showName();
}

// ---------- toast ----------
let tt;function toast(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),1600)}

if(matchMedia('(pointer:fine)').matches)$('hint').textContent='Scroll to pan · Ctrl/⌘ + scroll to zoom · Shift for multi-select & proportional resize';
setTimeout(()=>$('hint')?.remove(),7000);
fit();refresh();showName();initLibrary();
