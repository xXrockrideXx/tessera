<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Tessera</title>
<meta name="description" content="Touch-friendly vector shape studio">
<meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#192027" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tessera">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif;overscroll-behavior:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=DM+Serif+Display&display=swap">
<style>
/* Layout: full-screen app — toolbar / zoomable stage / tool panel / tab bar; panel docks right on wide screens */
:root{
  --bg:#e7ebef; --panel:#f8f9fb; --sunk:#eef1f4; --ink:#1b232d; --muted:#667180; --line:#d3d9e0;
  --accent:#0d7a70; --accent-ink:#ffffff; --accent-soft:#d6ece9; --danger:#b23a2e;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161b; --panel:#192027; --sunk:#141a20; --ink:#e4e9ee; --muted:#8b96a3; --line:#2a333d;
  --accent:#3dbcac; --accent-ink:#06211e; --accent-soft:#183a37; --danger:#e0705f; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161b; --panel:#192027; --sunk:#141a20; --ink:#e4e9ee; --muted:#8b96a3; --line:#2a333d;
  --accent:#3dbcac; --accent-ink:#06211e; --accent-soft:#183a37; --danger:#e0705f; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "stage" "panel" "tabs"}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{grid-area:top;display:flex;align-items:center;gap:4px;padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0 8px 0 4px;display:flex;align-items:center;gap:7px}
.brand i{width:16px;height:16px;display:inline-block;background:conic-gradient(var(--accent) 0 25%,#c8553d 0 50%,#e9a03b 0 75%,#2f5bd3 0);border-radius:3px;transform:rotate(45deg) scale(.8)}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink);position:relative}
.ib svg{width:22px;height:22px}
.ib:hover{background:var(--sunk)}
.ib[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ib:disabled{opacity:.3;cursor:default;background:none}
.sp{flex:1}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
@media (max-width:420px){.brand span{display:none}.ib{width:36px}}

/* stage */
.stage{grid-area:stage;position:relative;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;font-family:var(--f-mono);font-size:12px;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.eptag{position:absolute;top:12px;left:50%;transform:translateX(-50%);box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:5}
.fbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 18px rgba(10,20,30,.14);z-index:4}
.fbar button{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:500}
.fbar button:hover{background:var(--sunk)}
.fbar button:active{background:var(--accent-soft);color:var(--accent)}
.fbar svg{width:20px;height:20px}
.hint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;font-size:12px;color:var(--muted);max-width:60%}
.artshadow{filter:drop-shadow(0 2px 10px rgba(20,30,40,.14))}

/* panel */
.pwrap{grid-area:panel;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-top:1px solid var(--line)}
.handle{display:flex;align-items:center;justify-content:center;gap:8px;position:relative;padding:7px 16px 5px;color:var(--muted);font-family:var(--f-display);font-size:13px;letter-spacing:.04em;touch-action:none}
.handle .grip{position:absolute;top:4px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
.handle .hlab{margin-top:6px}
.handle .chev{width:16px;height:16px;margin-top:6px;transition:transform .2s}
#app.collapsed .handle .chev{transform:rotate(180deg)}
.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 52px;height:52px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--muted)}
.strip button:active{transform:scale(.92)}
.strip svg{width:70%;height:70%}
.strip .txt{font-family:"DM Serif Display",Georgia,serif;font-size:24px;color:var(--ink)}
.panel{background:var(--panel);height:min(272px,36vh);overflow:auto;padding-block:6px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:899px){
  #app.collapsed .panel{height:auto;padding-block:2px 10px}
  #app.collapsed:not(.t-shapes) .panel{display:none}
}
.tabs{grid-area:tabs;display:grid;grid-template-columns:repeat(5,1fr);background:var(--sunk);border-top:1px solid var(--line);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{padding:12px 4px 13px;font-family:var(--f-display);font-weight:500;font-size:15px;color:var(--muted);position:relative}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--panel)}
.tabs button[aria-selected="true"]::before{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
@media (min-width:900px){
  #app{grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top top" "stage tabs" "stage panel"}
  .pwrap{border-top:0;border-left:1px solid var(--line)}
  .handle{display:none}
  .panel{height:auto;flex:1;padding-block:14px}
  .tabs{border-top:0;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
}

h3{font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sec{display:grid;gap:8px;margin-bottom:16px}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px}
.lib button{aspect-ratio:1;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--muted);transition:transform .12s}
.lib button:hover{color:var(--ink)}
.lib button:active{transform:scale(.92)}
.lib svg{width:70%;height:70%}
.lib .txt{font-family:"DM Serif Display",Georgia,serif;font-size:24px;color:var(--ink)}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;justify-self:start}
.seg button{padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(32px,1fr));gap:7px}
.sw button,.sw label{aspect-ratio:1;border-radius:50%;border:1px solid rgba(0,0,0,.12);position:relative;cursor:pointer}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.sw .none{background:linear-gradient(135deg,transparent 46%,var(--danger) 46% 54%,transparent 54%),var(--panel)}
.sw label{background:conic-gradient(#e94b3c,#f5c341,#5fb35f,#3aa6c9,#5a5fd6,#c74fc0,#e94b3c);display:block}
.sw label input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row label{font-size:13px;color:var(--muted);min-width:64px}
input[type=range]{flex:1;accent-color:var(--accent);min-width:120px}
.val{font-family:var(--f-mono);font-size:12px;width:44px;text-align:right;font-variant-numeric:tabular-nums}
.tin{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);-webkit-user-select:text;user-select:text}
select.tin{padding:8px 10px}
.num{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.num label{display:grid;gap:3px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.num input{width:100%;min-width:0;font-family:var(--f-mono);font-size:14px;padding:8px 6px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;background:var(--sunk);font-size:13px}
.btns button svg{width:18px;height:18px}
.btns button:disabled{opacity:.35;cursor:default}
.btns button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pre{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--sunk);text-align:left}
.pre[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.pre .pvw{width:30px;height:30px;display:grid;place-items:center;flex:0 0 auto}.pre .pv{background:var(--panel);border:1.5px solid var(--muted);border-radius:3px}
.pre b{display:block;font-weight:600;font-size:13px}.pre small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.layers{display:grid;gap:4px}
.gr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:2px 4px}
.gr .ga{font-size:13px;color:var(--muted);font-family:var(--f-mono)}
.gr .ib{width:34px;height:34px}.gr .ib svg{width:18px;height:18px}
.tabs button{font-size:14px}
.lr{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;cursor:pointer}
.lr:hover{background:var(--sunk)}
.lr.on{background:var(--accent-soft)}
.lr .th{width:34px;height:34px;border-radius:7px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.lr .th svg{width:26px;height:26px}
.lr .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .nm small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.lr .ib{width:34px;height:34px}
.lr .ib svg{width:18px;height:18px}
.lr.dim .nm,.lr.dim .th{opacity:.4}

/* menu + modal + toast */
.menu{position:absolute;top:56px;left:max(10px,env(safe-area-inset-left,0px));z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:220px;box-shadow:0 12px 32px rgba(10,20,30,.18);display:grid}
.menu button{text-align:left;padding:11px 12px;border-radius:8px;font-size:15px;display:flex;gap:10px;align-items:center}
.menu button:hover{background:var(--sunk)}
.menu button svg{width:18px;height:18px;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,15,20,.5);display:grid;place-items:center;padding:16px}
.mbox{background:var(--panel);border-radius:16px;padding:18px;width:min(520px,100%);max-height:90%;overflow:auto;display:grid;gap:12px}
.mbox h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0}
.mbox img{width:100%;border-radius:10px;border:1px solid var(--line);background:repeating-conic-gradient(#e6e6e6 0 25%,#fff 0 50%) 0/16px 16px;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.mbox textarea{width:100%;height:110px;font-family:var(--f-mono);font-size:11px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--ink);padding:8px;resize:vertical;-webkit-user-select:text;user-select:text}
.pbtn{background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:10px;font-weight:600}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 14px;border-radius:999px;font-size:13px;z-index:50;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <header class="top">
    <button class="ib" id="bMenu" aria-label="Menu" title="Menu"></button>
    <div class="brand"><i></i><span>Tessera</span></div>
    <div class="sep"></div>
    <button class="ib" id="bSnap" aria-label="Smart snapping" title="Smart snapping (guides, 15° rotation)"></button>
    <button class="ib" id="bMulti" aria-label="Multi-select" title="Multi-select: tap to add shapes"></button>
    <div class="sp"></div>
    <button class="ib" id="bDup" aria-label="Duplicate" title="Duplicate (Ctrl+D)"></button>
    <button class="ib" id="bDel" aria-label="Delete" title="Delete"></button>
    <div class="sep"></div>
    <button class="ib" id="bUndo" aria-label="Undo" title="Undo (Ctrl+Z)"></button>
    <button class="ib" id="bRedo" aria-label="Redo" title="Redo (Ctrl+Shift+Z)"></button>
  </header>
  <div class="stage" id="stage">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#7d93a8" stroke-opacity=".22" stroke-width="1"/></pattern>
        <pattern id="gridM" width="250" height="250" patternUnits="userSpaceOnUse"><path d="M250 0H0V250" fill="none" stroke="#7d93a8" stroke-opacity=".42" stroke-width="1"/></pattern>
      </defs>
      <g id="world"></g>
    </svg>
    <div class="hint" id="hint">With a shape selected, drag anywhere to move it · tap empty space to deselect · two fingers to pan and zoom</div>
    <div class="fbar" id="fbar" hidden>
      <button data-qa="flip" data-arg="h" title="Mirror left to right (Shift+H)" aria-label="Mirror left to right"></button>
      <button data-qa="flip" data-arg="v" title="Flip top to bottom (Shift+V)" aria-label="Flip top to bottom"></button>
    </div>
    <button class="zoom" id="zoom" title="Fit to screen">100%</button>
    <button class="eptag pbtn" id="epDone" hidden>Done editing points</button>
  </div>
  <div class="pwrap" id="pwrap">
    <button class="handle" id="handle" aria-label="Collapse panel" aria-expanded="true"><span class="grip"></span><span class="hlab" id="hlab">Shapes</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
    <section class="panel" id="panel"></section>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="shapes">Shapes</button>
    <button role="tab" data-tab="style">Style</button>
    <button role="tab" data-tab="arrange">Arrange</button>
    <button role="tab" data-tab="layers">Layers</button>
    <button role="tab" data-tab="grid">Grid</button>
  </nav>
</div>

<script>

function resizeCanvas(nw,nh){

function act(name,arg){
  const ss=selShapes();
  switch(name){
    case'dup':{if(!ss.length)return;pushUndo();const k=snapOn?20:16,gm={};const cl=ss.map(s=>({...s,id:'s'+(nid++),x:s.x+k,y:s.y+k,locked:false,g:s.g?(gm[s.g]=gm[s.g]||gid()):undefined}));doc.shapes.push(...cl);sel=cl.map(s=>s.id);toast(cl.length>1?`Duplicated ${cl.length} shapes`:'Duplicated');break}
    case'del':{if(!ss.length)return;pushUndo();doc.shapes=doc.shapes.filter(s=>!sel.includes(s.id));toast(ss.length>1?`Deleted ${ss.length} shapes`:'Deleted');sel=[];break}
    case'align':{if(!ss.length)return;pushUndo();
      const mode=ss.length===1?'canvas':alignTo, ks=keyShape();
      const box=mode==='canvas'?{l:0,r:W,t:0,b:H}:mode==='key'&&ks?aabb(ks):union(ss);
      ss.filter(s=>!(mode==='key'&&s===ks)&&!s.locked).forEach(s=>{const b=aabb(s);if(arg==='l')s.x+=box.l-b.l;if(arg==='r')s.x+=box.r-b.r;if(arg==='c')s.x+=(box.l+box.r)/2-s.x;if(arg==='t')s.y+=box.t-b.t;if(arg==='b')s.y+=box.b-b.b;if(arg==='m')s.y+=(box.t+box.b)/2-s.y});break}
    case'dist':case'gap':{
      // equal gaps between edges (dist) or an exact gap in px (gap); the key shape, or the first in line, stays put
      const hz=arg==='h', need=name==='dist'?3:2; if(ss.length<need)return; pushUndo();
      const lo=hz?'l':'t',hi=hz?'r':'b',ax=hz?'x':'y';
      const o=[...ss].sort((a,b)=>aabb(a)[lo]-aabb(b)[lo]);
      let gap;
      if(name==='dist'){const span=aabb(o[o.length-1])[hi]-aabb(o[0])[lo];const sum=o.reduce((t,s)=>{const b=aabb(s);return t+b[hi]-b[lo]},0);gap=(span-sum)/(o.length-1)}
      else gap=gapVal;
      const ks=name==='gap'&&alignTo==='key'?keyShape():null, ki=ks?o.indexOf(ks):0;
      for(let i=ki+1;i<o.length;i++){const p=aabb(o[i-1]),b=aabb(o[i]);o[i][ax]+=p[hi]+gap-b[lo]}
      for(let i=ki-1;i>=0;i--){const n=aabb(o[i+1]),b=aabb(o[i]);o[i][ax]+=n[lo]-gap-b[hi]}
      toast(name==='dist'?`Even gaps of ${Math.round(gap)} px`:`Gaps set to ${gap} px`);break}
    case'match':{const ks=keyShape()||[...ss].sort((a,b)=>b.w*b.h-a.w*a.h)[0];if(ss.length<2)return;pushUndo();
      ss.filter(s=>s!==ks).forEach(s=>{if(arg!=='h')s.w=ks.w;if(arg!=='w')s.h=ks.h});
      toast(`Matched ${arg==='w'?'width':arg==='h'?'height':'size'} of ${alignTo==='key'?'key shape':'largest shape'}`);break}
    case'alignto':alignTo=arg;if(arg==='key'&&!sel.includes(keyId))keyId=sel[0];break;
    case'keyfirst':keyId=sel[0];alignTo='key';break;
    case'keylast':keyId=sel[sel.length-1];alignTo='key';break;
    case'swap':{if(ss.length!==2)return;pushUndo();const[a,b]=ss;[a.x,b.x]=[b.x,a.x];[a.y,b.y]=[b.y,a.y];toast('Swapped positions');break}
    case'flip':{const fl=ss.filter(s=>!s.locked);if(!fl.length)return;pushUndo();const b=union(fl),cx=(b.l+b.r)/2,cy=(b.t+b.b)/2;
      fl.forEach(s=>{if(arg==='h'){s.fx*=-1;s.x=2*cx-s.x}else{s.fy*=-1;s.y=2*cy-s.y}s.r=s.r?-s.r:0});
      toast(arg==='h'?'Mirrored left to right':'Flipped top to bottom');break}
    case'order':{if(!ss.length)return;pushUndo();let arr=doc.shapes;const ids=new Set(sel);
      if(arg==='front')arr=[...arr.filter(s=>!ids.has(s.id)),...arr.filter(s=>ids.has(s.id))];
      else if(arg==='back')arr=[...arr.filter(s=>ids.has(s.id)),...arr.filter(s=>!ids.has(s.id))];
      else if(arg==='fwd'){for(let i=arr.length-2;i>=0;i--)if(ids.has(arr[i].id)&&!ids.has(arr[i+1].id))[arr[i],arr[i+1]]=[arr[i+1],arr[i]]}
      else{for(let i=1;i<arr.length;i++)if(ids.has(arr[i].id)&&!ids.has(arr[i-1].id))[arr[i],arr[i-1]]=[arr[i-1],arr[i]]}
      doc.shapes=arr;break}
    case'ratio':lockRatio=!lockRatio;break;
    case'cpreset':{const[w,h]=arg.split('x').map(Number);resizeCanvas(w,h);return}
    case'csize':{resizeCanvas(pendW??W,pendH??H);return}
    case'corient':{resizeCanvas(H,W);return}
    case'scaleart':scaleArt=!scaleArt;break;
    case'bool':return booleanOp(arg);
    case'group':{if(ss.length<2)return;pushUndo();const g=gid(),ids=new Set(sel);const mem=doc.shapes.filter(s=>ids.has(s.id));
      const top=Math.max(...mem.map(s=>doc.shapes.indexOf(s)));const rest=doc.shapes.filter(s=>!ids.has(s.id));const at=rest.indexOf(doc.shapes.slice(top+1).find(s=>!ids.has(s.id)));
      mem.forEach(s=>s.g=g);rest.splice(at<0?rest.length:at,0,...mem);doc.shapes=rest;inG=null;toast(`Grouped ${mem.length} shapes`);break}
    case'ungroup':{const gs=new Set(ss.map(s=>s.g).filter(Boolean));if(!gs.size)return;pushUndo();doc.shapes.forEach(s=>{if(gs.has(s.g))delete s.g});inG=null;toast('Ungrouped');break}
    case'editpts':enterEdit(sel[0]);return;
    case'epdone':exitEdit();return;
    case'epdel':case'epcorner':case'epsmooth':{if(!ep||!ep.si)return;const s=byId(ep.id),c=ep.cs[ep.si[0]],i=ep.si[1],n=c[i];
      if(name==='epdel'){if(c.length<=3){toast('A shape needs at least 3 points');return}pushUndo();c.splice(i,1);ep.si=null}
      else if(name==='epcorner'){pushUndo();n.ix=n.ox=n.x;n.iy=n.oy=n.y;n.sm=false}
      else{pushUndo();const a=c[(i-1+c.length)%c.length],b=c[(i+1)%c.length];let dx=b.x-a.x,dy=b.y-a.y;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
        const li=Math.hypot(n.x-a.x,n.y-a.y)/3,lo=Math.hypot(b.x-n.x,b.y-n.y)/3;n.ix=n.x-dx*li;n.iy=n.y-dy*li;n.ox=n.x+dx*lo;n.oy=n.y+dy*lo;n.sm=true}
      normalisePts(s,ep.cs);break}
    case'split':return splitApart();
    case'sn':SN[arg]=!SN[arg];saveSN();break;
    case'snapmaster':snapOn=true;break;
    case'gridshow':doc.grid.show=!doc.grid.show;break;
    case'gsize':doc.grid.size=+arg;doc.grid.show=true;break;
    case'gshow':doc.gopt.show=!doc.gopt.show;break;
    case'glock':doc.gopt.lock=!doc.gopt.lock;break;
    case'gadd':{pushUndo();const c=visibleCenter();let p=arg==='v'?c.x:c.y,n=0;while(!addGuide(arg,p+n*20)&&n<50)n++;doc.gopt.show=true;toast(`${arg==='v'?'Vertical':'Horizontal'} guide added — drag it into place`);break}
    case'gpre':{pushUndo();let n=0;const m=gmarVal??Math.round(Math.min(W,H)*.05);
      const L=arg==='centre'?[['v',W/2],['h',H/2]]:arg==='thirds'?[['v',W/3],['v',2*W/3],['h',H/3],['h',2*H/3]]:[['v',m],['v',W-m],['h',m],['h',H-m]];
      L.forEach(([a,p])=>n+=addGuide(a,p));doc.gopt.show=true;toast(n?`Added ${n} guide${n>1?'s':''}`:'Those guides are already there');break}
    case'gsel':{if(!ss.length)return;pushUndo();const b=union(ss);let n=0;[['v',b.l],['v',(b.l+b.r)/2],['v',b.r],['h',b.t],['h',(b.t+b.b)/2],['h',b.b]].forEach(([a,p])=>n+=addGuide(a,p));doc.gopt.show=true;toast(`Added ${n} guides around the selection`);break}
    case'gclear':pushUndo();doc.guides=[];toast('All guides removed');break;
    case'gdel':pushUndo();doc.guides=doc.guides.filter(g=>g.id!==arg);break;
    case'vis':{const s=byId(arg);pushUndo();s.hidden=!s.hidden;if(s.hidden)sel=sel.filter(x=>x!==arg);break}
    case'lock':{const s=byId(arg);pushUndo();s.locked=!s.locked;break}
    case'pick':sel=multi?(sel.includes(arg)?sel.filter(x=>x!==arg):[...sel,arg]):[arg];inG=byId(arg)?.g||null;break;
    case'selall':sel=doc.shapes.filter(s=>!s.hidden&&!s.locked).map(s=>s.id);break;

}

      ${n===2?B('swap','','fh','Swap places'):''}</div></div>`;
  }
  h+=`<div class="sec"><h3>Flip &amp; order</h3><div class="btns">${B('flip','h','fh','Mirror')}${B('flip','v','fv','Flip')}</div>
    <div class="btns">${B('order','front','front','To front')}${B('order','fwd','fwd','Forward')}${B('order','bwd','bwd','Backward')}${B('order','back','back','To back')}</div></div>`;
  return h;
}
function pLayers(){
  if(!doc.shapes.length)return `<p class="note">The canvas is empty. Add something from the Shapes tab.</p>`;
  const rows=[...doc.shapes].reverse().map((s,i)=>{
    const nm=s.type==='text'?`“${esc(s.text)}”`:shapeN(s);
    const th=s.type==='text'?`<span style="font-family:${esc(FONTS[s.font||'display'])};color:${s.fill==='none'?'#999':s.fill};font-size:14px;font-weight:700">Aa</span>`:
      `<svg viewBox="-20 -20 40 40"><g transform="rotate(${s.r}) scale(${s.fx} ${s.fy})"><path d="${scaleD(shapeD(s),...(s.w>=s.h?[30,30*s.h/s.w]:[30*s.w/s.h,30]))}" fill-rule="evenodd" fill="${s.fill==='none'?'transparent':s.fill}" stroke="${s.stroke==='none'?(s.fill==='none'?'#999':'none'):s.stroke}" stroke-width="2"/></g></svg>`;
    return `<div class="lr ${sel.includes(s.id)?'on':''} ${s.hidden?'dim':''}" data-pick="${s.id}"><div class="th">${th}</div>
      <div class="nm">${nm}<small>${doc.shapes.length-i}${s.g?' · group':''} · ${Math.round(s.w)}×${Math.round(s.h)}${s.r?` · ${Math.round(s.r)}°`:''}</small></div>
      <button class="ib" data-act="lock" data-arg="${s.id}" aria-label="${s.locked?'Unlock':'Lock'}" title="${s.locked?'Unlock':'Lock'}" aria-pressed="${!!s.locked}">${s.locked?IC.lock:IC.unlock}</button>
      <button class="ib" data-act="vis" data-arg="${s.id}" aria-label="${s.hidden?'Show':'Hide'}" title="${s.hidden?'Show':'Hide'}">${s.hidden?IC.eyeoff:IC.eye}</button></div>`});
  return `<div class="layers">${rows.join('')}</div>`;
}
function pGrid(){
  const P=(a,arg,on,l)=>`<button data-act="${a}" data-arg="${arg||''}" aria-pressed="${!!on}">${on?'✓ ':''}${l}</button>`;
  const mar=gmarVal??Math.round(Math.min(W,H)*.05);
  let h=`<div class="sec"><h3>Snap to</h3>`;
  if(!snapOn)h+=`<p class="note">Smart snapping is switched off. <button class="pbtn" data-act="snapmaster" style="padding:5px 10px;margin-left:4px">Turn on</button></p>`;
  h+=`<div class="btns">${P('sn','obj',SN.obj,'Shapes &amp; canvas')}${P('sn','grid',SN.grid,'Grid')}${P('sn','guide',SN.guide,'Guides')}${P('sn','rot',SN.rot,'15° rotation')}</div></div>`;
  h+=`<div class="sec"><h3>Grid</h3><div class="btns">${P('gridshow','',doc.grid.show,'Show grid')}</div>
    <div class="row"><div class="seg" role="group">${[10,20,25,50,100].map(v=>`<button data-act="gsize" data-arg="${v}" aria-pressed="${doc.grid.size===v}">${v}</button>`).join('')}</div>
    <div class="num" style="grid-template-columns:76px;flex:0 0 auto"><input type="number" inputmode="numeric" id="gsz" value="${doc.grid.size}" aria-label="Grid size in px"></div><span class="note">px · heavier line every 5</span></div></div>`;
  h+=`<div class="sec"><h3>Guides</h3><div class="btns"><button data-act="gadd" data-arg="v">${IC.dh}<span>Add vertical</span></button><button data-act="gadd" data-arg="h">${IC.dv}<span>Add horizontal</span></button>
      <button data-act="gpre" data-arg="centre">Centre lines</button><button data-act="gpre" data-arg="thirds">Thirds</button><button data-act="gsel" ${sel.length?'':'disabled'}>Around selection</button></div>
    <div class="row"><button class="pbtn" data-act="gpre" data-arg="margin" style="padding:8px 12px">Margins</button><div class="num" style="grid-template-columns:76px;flex:0 0 auto"><input type="number" inputmode="numeric" id="gmar" value="${mar}" aria-label="Margin in px"></div><span class="note">px in from each edge</span></div>
    <div class="btns">${P('gshow','',doc.gopt.show,'Show guides')}${P('glock','',doc.gopt.lock,'Lock guides')}<button data-act="gclear" ${doc.guides.length?'':'disabled'}>Clear all</button></div>
    <p class="note">Drag a guide on the canvas to move it, or drag it off the canvas to remove it.</p></div>`;
  if(doc.guides.length){
    const gs=[...doc.guides].sort((a,b)=>a.axis.localeCompare(b.axis)||a.pos-b.pos);
    h+=`<div class="sec"><h3>${gs.length} guide${gs.length>1?'s':''}</h3><div class="layers">`+gs.map(g=>`<div class="gr"><span class="ga">${g.axis==='v'?'│ Vertical':'— Horizontal'}</span>
      <div class="num" style="grid-template-columns:90px"><input type="number" inputmode="decimal" data-gp="${g.id}" value="${Math.round(g.pos*10)/10}" aria-label="Guide position"></div>
      <button class="ib" data-act="gdel" data-arg="${g.id}" aria-label="Remove guide" title="Remove guide">${IC.del}</button></div>`).join('')+`</div></div>`;
  }
  return h;
}
function addGuide(axis,pos){pos=Math.round(pos*10)/10;if(doc.guides.some(g=>g.axis===axis&&Math.abs(g.pos-pos)<.5))return 0;doc.guides.push({id:gid(),axis,pos});return 1}
const wide=()=>matchMedia('(min-width:900px)').matches;
const TABN={shapes:'Shapes',style:'Style',arrange:'Arrange',layers:'Layers',grid:'Grid'};
function openTab(t){tab=t;setCollapsed(false,true)}
function setCollapsed(v,quiet){
  collapsed=v;try{localStorage.setItem('tessera.collapsed',v?'1':'0')}catch(e){}
  if(!quiet)renderPanel();
}
function renderChrome(){
  const app=$('app');app.classList.toggle('collapsed',collapsed);app.classList.toggle('t-shapes',tab==='shapes');
  const h=$('handle');h.setAttribute('aria-expanded',!collapsed);h.setAttribute('aria-label',collapsed?'Expand panel':'Collapse panel');
  $('hlab').textContent=collapsed?(tab==='shapes'?'More shapes':'Show '+TABN[tab]):TABN[tab];
}
function renderPanel(){
  renderChrome();
  if(panel.contains(document.activeElement)&&document.activeElement.matches('input:not([type=color]),select'))return;
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  panel.innerHTML={shapes:pShapes,style:pStyle,arrange:pArrange,layers:pLayers,grid:pGrid}[tab]();
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;const t=b.dataset.tab;
  if(t===tab&&!wide()){setCollapsed(!collapsed);return}
  tab=t;if(tab==='style'&&sel.length&&styleT==='bg')styleT='fill';
  if(collapsed&&tab!=='shapes')collapsed=false,setCollapsed(false,true);
  renderPanel()});
// handle: tap to toggle, or swipe down to collapse / up to expand
{let y0=null,moved=false;const h=$('handle');
 h.addEventListener('pointerdown',e=>{y0=e.clientY;moved=false;h.setPointerCapture(e.pointerId)});
 h.addEventListener('pointermove',e=>{if(y0==null)return;const d=e.clientY-y0;if(Math.abs(d)>24&&!moved){moved=true;if(d>0&&!collapsed)setCollapsed(true);else if(d<0&&collapsed)setCollapsed(false)}});
 h.addEventListener('pointerup',()=>{if(y0!=null&&!moved)setCollapsed(!collapsed);y0=null});
 h.addEventListener('pointercancel',()=>{y0=null});}
panel.addEventListener('click',e=>{
  const t=e.target.closest('[data-add],[data-col],[data-st],[data-act],[data-pick]');if(!t||t.disabled)return;
  if(t.dataset.add)return addShape(t.dataset.add);
  if(t.dataset.col)return applyColor(t.dataset.col);
  if(t.dataset.st){styleT=t.dataset.st;return renderPanel()}
  if(t.dataset.act){e.stopPropagation();return act(t.dataset.act,t.dataset.arg)}
  if(t.dataset.pick)return act('pick',t.dataset.pick);
});
let editing=false;
panel.addEventListener('input',e=>{
  const el=e.target,ss=selShapes();
  if(el.id==='gap'){gapVal=parseFloat(el.value)||0;return}
  if(el.id==='gmar'){gmarVal=parseFloat(el.value)||0;return}
  if(el.id==='gsz'){const v=parseFloat(el.value);if(v>=2&&v<=2000){doc.grid.size=v;renderCanvas()}return}
  if(el.dataset.gp){const g=doc.guides.find(x=>x.id===el.dataset.gp),v=parseFloat(el.value);if(!g||isNaN(v))return;if(!editing){pushUndo();editing=true}g.pos=v;renderCanvas();return}
  if(el.id==='cw'){pendW=parseFloat(el.value)||null;return}
  if(el.id==='ch'){pendH=parseFloat(el.value)||null;return}
  if(el.id==='cust'){if(!editing){pushUndo();editing=true}
    if(styleT==='bg')doc.bg=el.value;else ss.forEach(s=>{s[styleT]=el.value;if(styleT==='stroke'&&!s.sw)s.sw=6});
    if(styleT==='fill')lastFill=el.value;renderCanvas();return}
  if(!ss.length)return;
  if(!editing){pushUndo();editing=true}
  if(el.id==='sw'){ss.forEach(s=>{s.sw=+el.value;if(+el.value>0&&s.stroke==='none')s.stroke='#1b232d'});$('swv').textContent=el.value+'px'}
  else if(el.id==='op'){ss.forEach(s=>s.op=el.value/100);$('opv').textContent=el.value+'%'}
  else if(el.id==='txt'){const s=ss[0],old=(s.text||'').length||1;s.text=el.value;const nl=Math.max(1,el.value.length);s.w=Math.max(20,s.w*nl/old)}
  else if(el.dataset.k){const v=parseFloat(el.value);if(isNaN(v))return;const s=ss[0];const k=el.dataset.k;
    if(k==='w'||k==='h'){const val=Math.max(4,v);if(lockRatio){const f=val/s[k];s.w*=f;s.h*=f}else s[k]=val}else s[k]=v}
  renderCanvas();
});
panel.addEventListener('change',e=>{
  const ss=selShapes();
  if(e.target.id==='font'&&ss[0]){pushUndo();ss[0].font=e.target.value}
  editing=false;save();renderTop();
  if(e.target.id!=='txt'&&!e.target.dataset.k)renderPanel();else renderCanvas();
});
panel.addEventListener('focusout',()=>{setTimeout(()=>{if(!panel.contains(document.activeElement)){editing=false;renderPanel();renderTop();save()}},0)});
panel.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input'))e.target.blur()});

// ---------- top bar ----------
$('bMenu').innerHTML=IC.menu;$('bSnap').innerHTML=IC.magnet;$('bMulti').innerHTML=IC.multi;$('bDup').innerHTML=IC.dup;$('bDel').innerHTML=IC.del;$('bUndo').innerHTML=IC.undo;$('bRedo').innerHTML=IC.redo;
$('bSnap').onclick=()=>{snapOn=!snapOn;toast(snapOn?'Smart snapping on':'Smart snapping off');renderCanvas();renderTop()};
$('bMulti').onclick=()=>{multi=!multi;toast(multi?'Multi-select on: tap shapes to add or remove':'Multi-select off');renderTop()};
$('bDup').onclick=()=>act('dup');$('bDel').onclick=()=>act('del');$('bUndo').onclick=doUndo;$('bRedo').onclick=doRedo;
$('zoom').onclick=fit;
$('epDone').onclick=exitEdit;
{const fb=$('fbar').children;fb[0].innerHTML=IC.fh+'<span>Mirror</span>';fb[1].innerHTML=IC.fv+'<span>Flip</span>';
 $('fbar').addEventListener('click',e=>{const b=e.target.closest('[data-qa]');if(b)act(b.dataset.qa,b.dataset.arg)});}
let menuEl=null;
$('bMenu').onclick=e=>{e.stopPropagation();if(menuEl){menuEl.remove();menuEl=null;return}
  menuEl=document.createElement('div');menuEl.className='menu';
  menuEl.innerHTML=`<button data-m="export">${IC.img}Export image &amp; SVG</button><button data-m="canvas">${IC.ratio}Canvas size</button><button data-m="fit">${IC.fit}Fit canvas to screen</button><hr><button data-m="new">${IC.file}New blank canvas</button><button data-m="sample">${IC.spark}Load example</button>`;
  document.body.appendChild(menuEl);
  menuEl.onclick=ev=>{const m=ev.target.closest('[data-m]')?.dataset.m;if(!m)return;menuEl.remove();menuEl=null;
    if(m==='fit')fit();
    if(m==='new'){pushUndo();doc={bg:'#ffffff',W,H,shapes:[]};sel=[];tab='shapes';refresh();toast('New canvas — undo brings the old one back')}
    if(m==='sample'){pushUndo();doc=sample();syncSize();sel=[];fit();refresh()}
    if(m==='canvas'){sel=[];openTab('arrange');refresh()}
    if(m==='export')openExport();
  };
};
document.addEventListener('pointerdown',e=>{if(menuEl&&!menuEl.contains(e.target)&&e.target!==$('bMenu')){menuEl.remove();menuEl=null}});

// ---------- export ----------
function exportSVG(){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><rect width="${W}" height="${H}" fill="${doc.bg}"/>${doc.shapes.map(s=>shapeSVG(s,true)).join('')}</svg>`}
function openExport(){
  const svg=exportSVG();
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="mbox" role="dialog" aria-label="Export"><h2>Export</h2>
    <p class="note" id="pngnote">Rendering the PNG…</p><img id="pngimg" alt="Exported design">
    <h3>SVG code</h3><textarea id="svgcode" readonly></textarea>
    <div class="btns"><button class="pbtn" id="copysvg">Copy SVG code</button><button id="closex">Close</button></div></div>`;
  document.body.appendChild(m);
  $('svgcode').value=svg;
  m.addEventListener('click',e=>{if(e.target===m||e.target.id==='closex')m.remove()});
  $('copysvg').onclick=()=>{const ta=$('svgcode');navigator.clipboard?.writeText(svg).then(()=>toast('SVG copied')).catch(()=>{ta.focus();ta.select();toast('Selected — copy it from the box')})||(ta.focus(),ta.select())};
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const L=Math.max(W,H),sc=Math.min(4096/L,Math.max(1,2000/L));c.width=Math.round(W*sc);c.height=Math.round(H*sc);const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);
    try{$('pngimg').src=c.toDataURL('image/png');
      c.toBlob(b=>{if(!b)return;const f=new File([b],'tessera.png',{type:'image/png'});const btn=document.createElement('button');btn.className='pbtn';btn.textContent='Save or share PNG';
        btn.onclick=async()=>{try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]})}else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tessera.png';a.click()}}catch(e){}};
        $('copysvg').before(btn)},'image/png');$('pngnote').textContent=c.width+' × '+c.height+' px. Long-press (phone) or right-click (computer) the image to save it.'}catch(e){$('pngnote').textContent='Could not render the PNG here. Copy the SVG code instead.'}};
  img.onerror=()=>{$('pngnote').textContent='Could not render the PNG here. Copy the SVG code instead.'};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

// ---------- keyboard ----------
let spaceDown=false;
addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select'))return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(k===' '){spaceDown=true;e.preventDefault();return}
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();return}
  if(mod&&k==='y'){e.preventDefault();doRedo();return}
  if(mod&&k==='d'){e.preventDefault();act('dup');return}
  if(mod&&k==='a'){e.preventDefault();act('selall');return}
  if(k==='delete'||k==='backspace'){e.preventDefault();act(ep&&ep.si?'epdel':'del');return}
  if(k==='escape'){if(ep)return exitEdit();sel=[];inG=null;refresh();return}
  if(e.shiftKey&&!mod&&(k==='h'||k==='v')){e.preventDefault();act('flip',k);return}
  if(mod&&k==='g'){e.preventDefault();act(e.shiftKey?'ungroup':'group');return}
  if(k==='0'&&mod){e.preventDefault();fit();return}
  const ar={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1]}[k];
  if(ar&&sel.length){e.preventDefault();pushUndo();const st=e.shiftKey?10:1;selShapes().forEach(s=>{s.x+=ar[0]*st;s.y+=ar[1]*st});refresh()}
});
addEventListener('keyup',e=>{if(e.key===' ')spaceDown=false});

// ---------- toast ----------
let tt;function toast(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),1600)}

if(matchMedia('(pointer:fine)').matches)$('hint').textContent='Scroll to pan · Ctrl/⌘ + scroll to zoom · Shift for multi-select & proportional resize';
setTimeout(()=>$('hint')?.remove(),7000);
fit();refresh();
})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
